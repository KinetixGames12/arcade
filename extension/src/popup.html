<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kinetix Review</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icons/icon-48.png" alt=""><div><b>KINETIX</b><span>Game Review</span></div></header>
  <p id="state">Checking this tab…</p>
  <button id="go" disabled>Review this game</button>
  <label class="row"><input type="checkbox" id="auto"> Open the review automatically when a game ends</label>
  <p class="note">Finished games only. Kinetix never shows anything during a live game. No tracking: the only requests are to Lichess or chess.com for the finished game, and to the Kinetix page you open.</p>
  <p class="keys">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>K</kbd></p>
  <a href="https://kinetixgames12.github.io/arcade/chess/" target="_blank" rel="noopener">Open Kinetix Chess</a>
  <script type="module" src="popup.js"></script>
</body></html>
