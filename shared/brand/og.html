<!doctype html>
<!-- Source for og.png (1200x630). Re-render with headless Chrome:
     chrome --headless=new --window-size=1200,630 --screenshot=og.png og.html -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: U; src: url('../fonts/unbounded-latin-wght-normal.woff2'); font-weight: 200 900; }
@font-face { font-family: I; src: url('../fonts/inter-latin-wght-normal.woff2'); font-weight: 100 900; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #08070f; color: #f2f0fb; font-family: I, sans-serif; }
.sun { position: absolute; left: 640px; top: -120px; width: 760px; height: 760px; border-radius: 50%; background: radial-gradient(circle at 50% 45%, rgba(255,61,139,.55), rgba(123,92,255,.35) 45%, transparent 70%); }
.grid { position: absolute; left: -300px; right: -300px; bottom: -60px; height: 330px; transform: perspective(380px) rotateX(62deg); transform-origin: 50% 100%;
  background-image: linear-gradient(rgba(123,92,255,.6) 2px, transparent 2px), linear-gradient(90deg, rgba(123,92,255,.6) 2px, transparent 2px); background-size: 60px 60px;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 90%); }
.left { position: absolute; left: 80px; top: 110px; width: 560px; }
.lock { display: flex; align-items: center; gap: 26px; }
.lock img { width: 120px; height: 120px; border-radius: 34px; box-shadow: 0 24px 70px -10px rgba(255,61,139,.7); }
.lock span { font: 800 72px/1 U; letter-spacing: .1em; }
h2 { font: 800 50px/1.08 U; letter-spacing: -.02em; margin: 46px 0 18px; }
h2 em { font-style: normal; background: linear-gradient(120deg, #d9ff4a, #3ef0c8 45%, #7b5cff); -webkit-background-clip: text; color: transparent; }
p { margin: 0; font-size: 25px; color: #b9b4d4; }
.cards { position: absolute; right: 40px; top: 80px; width: 480px; height: 470px; }
.cards img { position: absolute; width: 330px; border-radius: 22px; box-shadow: 0 30px 60px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.12); }
.c1 { right: 120px; top: 0; transform: rotate(-9deg); }
.c2 { right: 0; top: 140px; transform: rotate(6deg); }
.c3 { right: 150px; top: 270px; transform: rotate(-3deg); }
</style></head><body>
<div class="sun"></div><div class="grid"></div>
<div class="left">
  <div class="lock"><img src="../icon.svg" alt=""><span>KINETIX</span></div>
  <h2>Games in<br><em>motion.</em></h2>
  <p>Chess · Fantasy sports · More on the way</p>
</div>
<div class="cards"><img class="c1" src="../art/fantasy-football.svg"><img class="c2" src="../art/fantasy-basketball.svg"><img class="c3" src="../art/chess.svg"></div>
</body></html>
