<!doctype html>
<!-- Renders icon PNGs: icon.html?src=../icon.svg at any square window size. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}img{display:block;width:100vw;height:100vh}</style></head>
<body><img id="i"><script>document.getElementById('i').src = new URLSearchParams(location.search).get('src');</script></body></html>
