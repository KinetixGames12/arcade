<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#08070f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Checkers · Kinetix</title>
<link rel="icon" type="image/svg+xml" href="../shared/icon.svg?v=3">
<link rel="apple-touch-icon" href="../shared/brand/apple-touch-icon.png">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="../shared/arcade.css?v=2">
<link rel="stylesheet" href="../daily/daily.css?v=2">
<link rel="stylesheet" href="checkers.css?v=1">
<script src="../shared/theme.js?v=1"></script>
</head>
<body>
<header class="ar-topbar dg-top">
  <a class="ar-brand" href="../" aria-label="Kinetix home"><img src="../shared/icon.svg?v=3" alt=""><span class="ar-wordmark">Kinetix</span></a>
  <a class="dg-title" href="./">Checkers</a>
  <span class="ar-spacer"></span>
  <button class="ar-icon-btn" id="helpBtn" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.5.2-.8.6-.8 1.1v.8M12 17h.01"/></svg></button>
  <span id="themeBtn"></span>
</header>
<main class="ck-layout">
  <section class="ck-board-col">
    <div class="ck-player" id="pTop"></div>
    <div class="ck-board" id="board" role="grid" aria-label="Checkers board"></div>
    <div class="ck-player" id="pBot"></div>
  </section>
  <aside class="ck-side ar-card">
    <div id="setup">
      <h2 class="ar-display">Play checkers</h2>
      <p class="ar-muted">Take on a bot, or pass the device to a friend.</p>
      <div class="ck-opp" id="opp" role="radiogroup" aria-label="Opponent"></div>
      <label class="ar-field">Your colour
        <select class="ar-select" id="color"><option value="d">Dark (moves first)</option><option value="l">Light</option><option value="r" selected>Random</option></select>
      </label>
      <button class="ar-btn lg ck-wide" id="start">Start game</button>
      <div class="ck-record" id="record"></div>
    </div>
    <div id="game" hidden>
      <p class="ck-status" id="status" aria-live="polite"></p>
      <div class="ck-tools">
        <button class="ar-btn ghost sm" id="undo">Undo</button>
        <button class="ar-btn ghost sm" id="flip">Flip board</button>
        <button class="ar-btn ghost sm" id="resign">Resign</button>
        <button class="ar-btn sm" id="newGame">New game</button>
      </div>
      <ol class="ck-moves" id="moves"></ol>
    </div>
  </aside>
</main>
<script type="module" src="checkers.js?v=1"></script>
</body>
</html>
